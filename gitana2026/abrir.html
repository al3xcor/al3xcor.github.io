<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abriendo…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1116;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:22px}
  .box{max-width:420px}
  .ic{font-size:64px;line-height:1}
  h1{font-size:24px;margin:14px 0 6px}
  p{color:#8b98a5;font-size:14px;margin:6px 0}
  a{color:#ffb020}
  .spin{width:30px;height:30px;border:3px solid #2a323d;border-top-color:#ffb020;border-radius:50%;animation:sp 1s linear infinite;margin:18px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="spin"></div>
  <div class="ic" id="ic" style="display:none"></div>
  <h1 id="msg">Abriendo la broma…</h1>
  <p id="sub">Enviando la orden a todos los móviles.</p>
  <p><a href="/">Volver a la web</a></p>
</div>
<script>
(function(){
  "use strict";
  var TOPIC = "https://ntfy.sh/cumple-gitana-al3x-7f3k9m";
  var valor = /abrir/i.test(location.pathname) ? "abierto" : "cerrado";
  fetch(TOPIC, { method: "POST", body: valor })
    .then(function(){
      document.getElementById("spin").style.display = "none";
      document.getElementById("ic").style.display = "block";
      if (valor === "abierto"){
        document.getElementById("ic").textContent = "\u{1F513}";
        document.getElementById("msg").textContent = "Web ABIERTA";
        document.getElementById("sub").textContent = "A partir de ahora, todo el que escanee el QR entra a la broma (puede tardar unos segundos en propagarse).";
      } else {
        document.getElementById("ic").textContent = "\u{1F512}";
        document.getElementById("msg").textContent = "Web CERRADA";
        document.getElementById("sub").textContent = "Los invitados volveran a ver 'mantenimiento'. Tu acceso de organizador sigue funcionando.";
      }
    })
    .catch(function(){
      document.getElementById("spin").style.display = "none";
      document.getElementById("ic").style.display = "block";
      document.getElementById("ic").textContent = "⚠️";
      document.getElementById("msg").textContent = "No se pudo enviar";
      document.getElementById("sub").textContent = "Comprueba los datos del movil e intentalo otra vez.";
    });
})();
</script>
</body>
</html>
