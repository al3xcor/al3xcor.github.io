<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<title>Cañada de la gitana · WiFi</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --tx:#e6edf3; --mut:#8b98a5; --acc:#ffb020; --bad:#ff5c5c; --good:#3fb950; --rick:#e62117;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx); min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; padding:14px 14px 70px;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:520px}
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px 12px}
  .brand{font-size:13px; color:var(--mut); display:flex; align-items:center; gap:8px; letter-spacing:.02em}
  .sig{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
  .top b{color:var(--acc)}
  .prog{font-size:12px;color:var(--mut);white-space:nowrap}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px 18px; margin-bottom:14px;
  }
  h1{font-size:22px; margin:0 0 8px}
  h2{font-size:19px; margin:0 0 6px}
  p{margin:0 0 12px}
  .mut{color:var(--mut)}
  .small{font-size:13px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .btn{
    display:block; width:100%; min-height:52px; padding:12px 16px; margin:10px 0 0;
    border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--tx);
    font-size:16px; font-weight:600; cursor:pointer; text-align:center;
    transition:transform .08s ease, background .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--acc); border-color:var(--acc); color:#1a1300}
  .btn.ghost{background:transparent; color:var(--mut); font-weight:500; font-size:14px; min-height:44px}
  .btn.ok{background:var(--good); border-color:var(--good); color:#04160a}
  .btn.bad{background:var(--bad); border-color:var(--bad); color:#1a0505}
  .btn[aria-disabled="true"]{opacity:.45; pointer-events:none}
  :focus-visible{outline:3px solid var(--acc); outline-offset:2px}
  input[type=text]{
    width:100%; min-height:52px; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:#0b0e13; color:var(--tx); font-size:16px;
  }
  /* portal router */
  .router{border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#f4f6f8; color:#1b2430; margin-bottom:14px}
  .rhead{background:linear-gradient(90deg,#12325e,#1f5aa8); color:#fff; padding:10px 14px; font-size:13px; display:flex; align-items:center; gap:8px}
  .rhead .dot{width:8px;height:8px;border-radius:50%;background:#7be495; box-shadow:0 0 6px #7be495}
  .rbody{padding:18px}
  .rbody h2{color:#12325e}
  .bar{height:10px; background:#d9e0e8; border-radius:99px; overflow:hidden; margin:6px 0 10px}
  .bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#1f5aa8,#4d9bff); border-radius:99px; transition:width .2s linear}
  .mcode{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#5a6b7d; min-height:18px}
  /* grid emojis captcha */
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 4px}
  .cell{
    aspect-ratio:1; border:2px solid var(--line); border-radius:12px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center; gap:1px; font-size:clamp(18px,7vw,30px);
    cursor:pointer; user-select:none; padding:4px;
  }
  .cell.sel{border-color:var(--acc); background:#3a2f10}
  .opts{display:flex; gap:10px; margin-top:10px}
  .opts .btn{flex:1}
  /* chips ordenar frases */
  .construida{min-height:50px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .chip{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin:3px;font-size:15px;cursor:pointer;color:var(--tx)}
  .chip.placed{background:#3a2f10;border-color:var(--acc);cursor:default}
  .chip:disabled{opacity:.5}
  /* simon */
  .pads{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0}
  .pad{aspect-ratio:1.3; border-radius:14px; border:2px solid var(--line); background:var(--panel2); font-size:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none}
  .pad.lit{filter:brightness(2.2)}
  .pad.good{border-color:var(--good)}
  .pad.apagado{opacity:.07}
  /* boton huye */
  .huir{position:relative; height:220px; border-radius:14px; border:1px solid var(--line); background:#0b0e13; overflow:hidden; margin-top:8px}
  .huir .btn{position:absolute; width:auto; min-width:150px; margin:0; left:50%; top:50%; transform:translate(-50%,-50%)}
  /* teclado bochinche */
  .escrito{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#0b0e13;padding:8px 10px;font-size:20px;letter-spacing:.14em;font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:10px}
  .cursor{animation:blink 1s steps(1) infinite}
  .teclado{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
  .tecla{min-height:50px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); font-size:20px; font-weight:700; cursor:pointer; text-transform:uppercase}
  .tecla:active{background:var(--acc); color:#1a1300}
  .tecla.ancha{grid-column:span 6; font-size:15px; text-transform:none}
  /* mentiroso */
  .holes{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0}
  .hole{aspect-ratio:1; border-radius:12px; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:clamp(26px,10vw,44px); cursor:pointer; user-select:none}
  .hole.pop{border-color:var(--acc); background:#2a2410}
  .hole.bien{animation:popbueno .3s ease}
  .hole.mal{animation:popmal .3s ease}
  /* sin contar */
  .tapgrande{width:100%; min-height:130px; border-radius:18px; font-size:22px; font-weight:800}
  /* reaccion */
  .rbox{min-height:130px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; cursor:pointer; user-select:none; text-align:center; padding:10px}
  .rbox[data-estado="espera"]{background:var(--panel2)}
  .rbox[data-estado="verde"]{background:var(--good); color:#04160a}
  .rbox[data-estado="fallo"]{background:var(--bad); color:#1a0505}
  .rbox[data-estado="hecho"]{background:var(--panel2)}
  /* teclado numerico */
  .numk{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:280px; margin:10px auto 0}
  .numk button{min-height:56px; font-size:22px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); font-weight:700; cursor:pointer}
  .numk button.ancha{grid-column:span 3; font-size:15px}
  /* mastermind */
  .slots{display:flex; gap:8px; justify-content:center; margin:10px 0}
  .slot{width:54px; height:54px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:26px}
  .slot.on{border-style:solid; border-color:var(--acc)}
  .fb{font-size:13px; color:var(--mut); border-top:1px solid var(--line); padding:6px 2px; display:flex; justify-content:space-between; gap:8px}
  .fb b{color:var(--tx)}
  /* laberinto */
  .maze{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; max-width:300px; margin:0 auto}
  .celda{aspect-ratio:1; border-radius:8px; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:18px; user-select:none}
  .celda.muro{background:#080b0f; border-color:#080b0f}
  .celda.jugador{background:var(--acc); color:#1a1300; font-weight:800}
  .celda.meta{background:#3a2f10; border-color:var(--acc)}
  .dpad{display:grid; grid-template-columns:repeat(3,64px); gap:6px; justify-content:center; margin-top:12px}
  .dpad button{min-height:52px; font-size:20px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); cursor:pointer}
  /* diploma */
  .dip{border:3px double var(--acc); border-radius:14px; padding:18px; text-align:center; background:var(--panel2)}
  .dip .ttl{font-size:13px; letter-spacing:.18em; color:var(--acc); text-transform:uppercase}
  .dip .who{font-size:24px; font-weight:800; margin:10px 0 4px}
  .pwd{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:20px; letter-spacing:.12em; text-decoration:line-through; text-decoration-color:var(--bad); text-decoration-thickness:2px}
  .sello{font-size:40px; margin:8px 0}
  /* final */
  .overlay{position:fixed; inset:0; background:rgba(5,7,10,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center; z-index:50}
  .big{font-size:clamp(26px,8vw,40px); font-weight:900; line-height:1.1; margin:6px 0}
  .spin{width:26px;height:26px;border:3px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite}
  .ytbox{width:100%; max-width:480px; margin-top:14px; position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000; cursor:pointer}
  .ytbox img{width:100%; display:block}
  .ytplay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:rgba(0,0,0,.35); color:#fff; font-weight:700; font-size:14px; padding:10px}
  .ytplay .tri{width:0;height:0;border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent}
  .ytbox iframe{width:100%; aspect-ratio:16/9; border:0; display:block}
  .foot{display:flex; align-items:center; justify-content:center; gap:10px; color:var(--mut); font-size:11px; padding:16px 0 20px}
  #reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;font-size:11px;padding:4px 8px;cursor:pointer}
  .toast{position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); color:var(--tx); padding:10px 16px; border-radius:99px; font-size:14px; z-index:60; max-width:92vw; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.5)}
  /* notas / sellos */
  .notas-btn{position:fixed; right:12px; bottom:14px; z-index:40; background:var(--panel2); border:1px solid var(--line); color:var(--tx); border-radius:99px; padding:8px 14px; font-size:13px; cursor:pointer}
  .notas-panel{position:fixed; left:12px; right:12px; bottom:62px; z-index:41; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; max-width:420px; margin:0 auto; box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .oculto{display:none !important}
  .dig{display:inline-block; min-width:32px; margin:3px; padding:6px 0; text-align:center; border-radius:8px; background:var(--panel2); border:1px solid var(--acc); font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700}
  .anim-in{animation:in .25s ease}
  .shake{animation:shk .4s ease}
  @keyframes in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes popbueno{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes popmal{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="sig"></span> Cañada de la gitana <b>· 5G</b></div>
    <div class="prog" id="prog"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">Portal de invitados v2.2 · <button id="reset" type="button">empezar de cero</button></footer>
</div>
<button class="notas-btn" id="notasBtn" type="button">📝 <span id="notasN">0</span>/16</button>
<div class="notas-panel oculto" id="notasPanel">
  <h2 style="margin-bottom:6px">Tus sellos</h2>
  <p class="mut small" style="margin-bottom:8px">Cada fase superada te da un sello con un dígito. En la fase 13 te van a hacer falta <b>todos</b>.</p>
  <div id="notasLista"></div>
  <button class="btn ghost" id="notasCerrar" type="button">Cerrar</button>
</div>
<div class="notas-panel oculto" id="adminPanel">
  <h2 style="margin-bottom:6px">🔓 Panel de administrador</h2>
  <p class="mut small" style="margin-bottom:8px">Shhh. Nadie más sabe que esto existe.</p>
  <button class="btn" id="admSkip" type="button">⏭ Saltar esta fase (con sello)</button>
  <button class="btn" id="admCodigo" type="button">🔢 Ver el código de la fase 13</button>
  <button class="btn" id="admExamen" type="button">🎓 Modo examen: siempre acierto</button>
  <button class="btn ghost" id="admCerrar" type="button">Cerrar</button>
</div>

/* ================= motor de Simón (reutilizado por 3 niveles) ================= */
function simonRun(o){
  // o = {rondas, base, inverso, ciego, onWin, onFail}
  var rondas = o.rondas, base = o.base;
  var ronda = 0, fallos = 0, muerto = false;
  var timers = [];
  function limpia(){ timers.forEach(clearTimeout); timers = []; }
  function en(ms, fn){ var t = setTimeout(fn, ms); timers.push(t); return t; }
  function seguro(fn){ return function(){ if (muerto || !$("smsj")) return; fn(); }; }

  app.className = "anim-in";
  app.innerHTML =
    '<div class="card" id="sim">' +
      '<h2>' + esc(o.titulo) + '</h2>' +
      '<p class="mut small">' + esc(o.sub) + '</p>' +
      '<div class="pads" id="pads"></div>' +
      '<p class="small" id="smsj" style="text-align:center;min-height:22px"></p>' +
    '</div>';
  setProg(faseTxt(G.i + 1));

  var padEls = [];
  var pads = $("pads");
  PADS_EMO.forEach(function(e, i){
    var p = document.createElement("div");
    p.className = "pad"; p.textContent = e; p.setAttribute("role","button"); p.tabIndex = 0;
    p.dataset.i = i;
    pads.appendChild(p); padEls.push(p);
  });

  var sec = [], turno = 0, jugando = false;

  function pulsar(i){
    if (muerto) return;
    var p = padEls[i];
    if (!p || !p.classList) return;
    p.classList.add("lit"); p.style.background = PADS_COL[i];
    en(260, function(){ if (p.classList){ p.classList.remove("lit"); p.style.background = "var(--panel2)"; } });
    if (jugando) comprobar(i);
  }
  padEls.forEach(function(p, i){
    p.addEventListener("click", function(){ pulsar(i); });
    p.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); pulsar(i); } });
  });

  function nuevaRonda(){
    if (muerto || !$("smsj")) return;
    ronda++;
    turno = 0; jugando = false;
    sec = [];
    for (var i = 0; i < base + ronda - 1; i++) sec.push(rnd(4));
    $("smsj").textContent = "Ronda " + ronda + "/" + rondas + " · mira la secuencia" + (o.inverso ? " (luego al revés)" : "") + "…";
    if (o.ciego) padEls.forEach(function(p){ p.classList.remove("apagado"); });
    var k = 0;
    (function paso(){
      if (muerto || !$("smsj")) return;
      if (k >= sec.length){
        jugando = true;
        if (o.ciego) padEls.forEach(function(p){ p.classList.add("apagado"); });
        $("smsj").textContent = o.inverso ? "¡Repítela AL REVÉS!" : "¡Repítela!";
        return;
      }
      var n = sec[k++];
      padEls[n].classList.add("lit"); padEls[n].style.background = PADS_COL[n];
      en(430, function(){ padEls.forEach(function(p){ if (p.classList){ p.classList.remove("lit"); p.style.background = "var(--panel2)"; } }); });
      en(620, paso);
    })();
  }

  function comprobar(i){
    var esperado = o.inverso ? sec[sec.length - 1 - turno] : sec[turno];
    if (esperado === i){
      turno++;
      if (turno >= sec.length){
        jugando = false;
        $("smsj").textContent = "¡Correcto!";
        if (ronda >= rondas){ limpia(); en(700, function(){ if (!muerto) o.onWin(); }); }
        else en(1100, function(){ if (!muerto) nuevaRonda(); });
      }
    } else {
      jugando = false;
      fallos++;
      limpia();
      if (fallos >= 2){ o.onFail(); return; }
      $("smsj").textContent = "Fallaste. Se corta la conexión. Repetimos ronda.";
      en(1300, function(){ if (!muerto) nuevaRonda(); });
    }
  }
  nuevaRonda();
}

/* ================= N8: el mentiroso ================= */
screens.n8 = function(){
  setProg(faseTxt(8));
  G.i = 7;
  var score = 0, errores = 0, muerto = false, timer = null;
  var holes = [];

  app.innerHTML =
    '<div class="card anim-in" id="ml" data-score="0" data-errores="0">' +
      '<h2>Fase 8 · El mentiroso</h2>' +
      '<p class="mut small">Toca solo cuando salga <b>\u{1F973}</b>. Si sale <b>\u{1F389}</b>, NO toques: miente. Diez aciertos y pasas. Cada fallo reinicia la ronda.</p>' +
      '<div class="holes" id="holes"></div>' +
      '<p class="small" id="mlmsg" style="text-align:center;min-height:20px"></p>' +
    '</div>';
  var cont = $("holes");
  for (var i = 0; i < 9; i++){
    (function(i){
      var h = document.createElement("div");
      h.className = "hole"; h.dataset.h = i;
      h.addEventListener("click", function(){ pegar(h); });
      cont.appendChild(h); holes.push(h);
    })(i);
  }
  function marca(){
    var ml = $("ml");
    if (ml){ ml.dataset.score = String(score); ml.dataset.errores = String(errores); }
  }
  function ocultar(h){
    h.classList.remove("pop"); h.innerHTML = ""; delete h.dataset.tipo;
    setTimeout(function(){ h.classList.remove("bien"); h.classList.remove("mal"); }, 350);
  }
  function pegar(h){
    if (!h.classList.contains("pop") || muerto) return;
    if (h.dataset.tipo === "bueno"){
      score++; h.classList.add("bien"); ocultar(h);
      $("mlmsg").textContent = "¡Bien! " + score + "/10";
      marca();
      if (score >= 10){
        muerto = true; clearTimeout(timer);
        holes.forEach(function(x){ clearTimeout(x._t); ocultar(x); });
        setTimeout(siguiente, 600);
      }
    } else {
      errores++; h.classList.add("mal"); ocultar(h);
      $("mlmsg").textContent = "¡Era mentira! Errores: " + errores + "/3 · ronda reiniciada";
      marca();
      if (errores >= 3){
        muerto = true; clearTimeout(timer);
        holes.forEach(function(x){ clearTimeout(x._t); ocultar(x); });
        setTimeout(function(){ rendicion("El mentiroso te ha vencido. Le pasan cosas."); }, 800);
      } else {
        score = 0; marca();
      }
    }
  }
  function pop(){
    if (muerto) return;
    var h = holes[rnd(9)];
    var bueno = Math.random() < 0.68;
    h.dataset.tipo = bueno ? "bueno" : "malo";
    h.classList.add("pop");
    h.innerHTML = bueno ? "\u{1F973}" : "\u{1F389}";
    clearTimeout(h._t);
    h._t = setTimeout(function(){ ocultar(h); }, Math.max(780, 1150 - score * 45));
    timer = setTimeout(pop, Math.max(620, 1200 - score * 55));
  }
  pop();
};

/* ================= N10: reaccion ================= */
screens.n10 = function(){
  setProg(faseTxt(10));
  G.i = 9;
  var ventanas = [700, 550, 450];
  var ronda = 0, intentos = 0, estado = "espera", t0 = 0, timer = null;

  app.innerHTML =
    '<div class="card anim-in" id="rx">' +
      '<h2>Fase 10 · Reflejos</h2>' +
      '<p class="mut small">Toca la caja <b>cuando se ponga verde</b>. Ni antes (fallo) ni muy después. Tres rondas, cada una más rápida.</p>' +
      '<div class="rbox" id="rbox" data-estado="espera" role="button" tabindex="0">ESPERA…</div>' +
      '<p class="mut small" id="rxmsg" style="text-align:center;min-height:20px;margin-top:10px"></p>' +
    '</div>';

  function empezar(){
    estado = "espera";
    var box = $("rbox");
    box.dataset.estado = "espera";
    box.textContent = "ESPERA…";
    $("rxmsg").textContent = "Ronda " + (ronda + 1) + "/3 · ventana de " + ventanas[ronda] + " ms";
    timer = setTimeout(function(){
      if (estado !== "espera") return;
      estado = "verde"; t0 = Date.now();
      box.dataset.estado = "verde";
      box.textContent = "¡AHORA!";
    }, 1200 + rnd(1400));
  }
  function tocar(){
    var box = $("rbox");
    if (!box) return;
    if (estado === "espera"){
      clearTimeout(timer);
      estado = "fallo"; box.dataset.estado = "fallo"; box.textContent = "DEMASIADO PRONTO";
      fallo("Has tocado antes de tiempo. Los nervios.");
    } else if (estado === "verde"){
      var dt = Date.now() - t0;
      estado = "hecho"; box.dataset.estado = "hecho";
      if (dt <= ventanas[ronda]){
        box.textContent = "¡En " + dt + " ms!";
        ronda++;
        if (ronda >= 3){ setTimeout(siguiente, 700); }
        else { setTimeout(empezar, 900); }
      } else {
        box.dataset.estado = "fallo";
        box.textContent = "MUY LENTO: " + dt + " ms";
        fallo("La ventana era de " + ventanas[Math.min(ronda,2)] + " ms.");
      }
    }
  }
  function fallo(msg){
    intentos++;
    $("rxmsg").textContent = msg + " Fallos: " + intentos + "/2";
    if (intentos >= 2){ setTimeout(function(){ rendicion("Tus reflejos son de lunes por la mañana."); }, 900); }
    else { setTimeout(empezar, 1100); }
  }
  $("rbox").addEventListener("click", tocar);
  $("rbox").addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); tocar(); } });
  empezar();
};

screens.n12 = function(){

    var opciones = [{w: NUM[correcta], ok: true}];
    var usados = {};
    usados[correcta] = 1;
    while (opciones.length < 4){
      var w = 1 + rnd(10);
      if (usados[w]) continue;
      usados[w] = 1;
      opciones.push({w: NUM[w], ok: false});
    }

  }
  var idx = 0, aciertos = 0;

    '<div class="card anim-in" id="sm">' +

      '<div id="smbody"></div>' +
    '</div>';
  function mostrar(){
    if (idx >= preguntas.length){
      setTimeout(function(){
        toast("Has acertado " + aciertos + " de 4.", 2500);
        siguiente();
      }, 500);
      return;
    }
    var q = preguntas[idx];
    var ops = pick(q.opciones, q.opciones.length);
    $("smbody").innerHTML =
      '<p><b>' + (idx+1) + '/4.</b> ¿Cuánto es <b>' + NUM[q.a].toUpperCase() + '</b> más <b>' + NUM[q.b].toUpperCase() + '</b>?</p>' +
      '<div class="grid" style="grid-template-columns:1fr 1fr" id="smops"></div>';
    var box = $("smops");
    ops.forEach(function(o){
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = o.w;
      b.onclick = function(){
        box.querySelectorAll("button").forEach(function(x){ x.disabled = true; });
        if (o.ok){ b.className = "btn ok"; aciertos++; }
        else {
          b.style.borderColor = "var(--bad)";
          var buena = q.opciones.filter(function(x){ return x.ok; })[0];
          Array.prototype.some.call(box.querySelectorAll("button"), function(x){ if (x.textContent === buena.w){ x.className = "btn ok"; return true; } return false; });
        }
        setTimeout(function(){ idx++; mostrar(); }, 1600);
      };
      box.appendChild(b);
    });
  }
  mostrar();
};

/* ================= N14: mastermind de emojis ================= */
screens.n14 = function(){
  setProg(faseTxt(14));
  G.i = 13;
  var codigo = [rnd(6), rnd(6), rnd(6)];
  var intento = [];
  var usados = 0;
  var resuelto = false;

  app.innerHTML =
    '<div class="card anim-in" id="mm" data-codsol="' + codigo.join(",") + '">' +
      '<h2>Fase 14 · La caja de los emojis</h2>' +
      '<p class="mut small">Adivina la combinación de 3 emojis en 6 intentos. Tras cada intento te digo cuántos están en su sitio (✓) y cuántos están pero cambiados (~).</p>' +
      '<div class="slots" id="slots"></div>' +
      '<div class="grid" style="grid-template-columns:repeat(3,1fr)" id="mmkeys"></div>' +
      '<div id="mmfb"></div>' +
    '</div>';
  var slots = $("slots");
  for (var s = 0; s < 3; s++){
    var d = document.createElement("div");
    d.className = "slot"; slots.appendChild(d);
  }
  $("mmkeys").innerHTML = EMO_MASTER.map(function(e, i){
    return '<button class="tecla" data-e="' + i + '" type="button" style="min-height:56px">' + e + '</button>';
  }).join("") + '<button class="tecla ancha" data-e="__bs" type="button">⌫</button>' +
             '<button class="tecla ancha" data-e="__ok" type="button" style="background:var(--acc);color:#1a1300">PROBAR</button>';

  function pintar(){
    Array.prototype.forEach.call(slots.children, function(el, i){
      el.textContent = intento[i] !== undefined ? EMO_MASTER[intento[i]] : "";
      el.className = "slot" + (intento[i] !== undefined ? " on" : "");
    });
  }
  $("mmkeys").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    var k = b.dataset.e;
    if (k === "__bs"){ intento.pop(); pintar(); return; }
    if (k === "__ok"){
      if (intento.length < 3 || resuelto) return;
      resuelto = true;
      usados++;
      var ex = 0, pr = 0, uc = [], ue = [];
      for (var i = 0; i < 3; i++){
        if (intento[i] === codigo[i]){ ex++; uc[i] = ue[i] = true; }
      }
      for (var j = 0; j < 3; j++){
        if (ue[j]) continue;
        for (var k2 = 0; k2 < 3; k2++){
          if (!uc[k2] && intento[j] === codigo[k2]){ pr++; uc[k2] = true; break; }
        }
      }
      var linea = document.createElement("div");
      linea.className = "fb";
      linea.innerHTML = "<span>" + intento.map(function(x){ return EMO_MASTER[x]; }).join(" ") + "</span>" +
        "<span><b>" + ex + " ✓</b> · " + pr + " ~</span>";
      $("mmfb").appendChild(linea);
      if (ex === 3){
        toast("¡Combinación correcta!", 2000);
        setTimeout(siguiente, 700);
      } else if (usados >= 6){
        setTimeout(function(){ rendicion("Seis intentos y ni un ✓. La caja te ha ganado."); }, 700);
      } else {
        intento = []; pintar();
      }
      return;
    }
    if (intento.length < 3){ intento.push(+k); pintar(); }
  });
  pintar();
};

      '<p class="mut small" id="mzmsg" style="text-align:center;min-height:20px;margin-top:10px">Movimientos: 0</p>' +
    '</div>';

        var cls = "celda";

      return;

    $("mzmsg").textContent = "Movimientos: " + pasos;
    pintar();

      setTimeout(function(){ rendicion("Sesenta movimientos para no llegar. Impresionante."); }, 400);

    var b = e.target.closest("button");

};

  function cardTitulo(){
    $("bs").innerHTML =
      '<h2>' + (rondas === 0 ? "Fase 17 · Examen sorpresa" : "Recuperación " + rondas + "/2") + '</h2>' +
      '<p class="mut small">10 preguntas al azar del banco. Mínimo un <b>7</b> para aprobar. Sin chuletas… salvo que seas el organizador.</p>' +
      '<div id="bbody"></div>';
  }
  function mostrar(){
    if (idx >= actual.length){
      var nota = aciertos;
      setTimeout(function(){
        if (nota >= 7){
          toast("¡Aprobado con un " + nota + "!", 2200);
          setTimeout(function(){ go("diploma"); }, 700);
        } else {
          rondas++;
          if (rondas >= 3){ rendicion("Ni a la tercera. El profesor se apiada de ti. Pasa."); return; }
          toast("Un " + nota + ". A recuperación (" + rondas + "/2).", 2200);
          setTimeout(function(){
            idx = 0; aciertos = 0;
            actual = elegir() || [];
            cardTitulo();
            mostrar();
          }, 900);
        }
      }, 600);
      return;
    }
    var q = actual[idx];
    var ops = pick(q.a, q.a.length);
    $("bbody").innerHTML =
      '<p><b>' + (idx+1) + '/10.</b> ' + esc(q.q) + '</p>' +
      '<div id="bopts"></div>' +
      '<p class="mut small" id="bfb" style="margin-top:10px"></p>';
    var box = $("bopts");
    ops.forEach(function(o){
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = o.t;
      b.onclick = function(){
        box.querySelectorAll("button").forEach(function(x){ x.disabled = true; });
        var correcta = o.ok || G.examenAyuda;
        if (correcta){
          b.className = "btn ok"; aciertos++;
          $("bfb").textContent = q.why;
        } else {
          b.style.borderColor = "var(--bad)";
          var buen = q.a.filter(function(x){ return x.ok; })[0];
          Array.prototype.some.call(box.querySelectorAll("button"), function(x){ if (x.textContent === buen.t){ x.className = "btn ok"; return true; } return false; });
          $("bfb").textContent = q.why;
        }
        setTimeout(function(){ idx++; mostrar(); }, 2200);
      };
      box.appendChild(b);
    });
  }
  app.innerHTML = '<div class="card anim-in" id="bs"></div>';
  actual = elegir() || [];
  cardTitulo();
  mostrar();
};

/* ================= DIPLOMA ================= */
screens.diploma = function(){
  setProg("Completado");
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var p1 = "", p2 = "";
  for (var i = 0; i < 4; i++) p1 += chars[rnd(chars.length)];
  for (var j = 0; j < 4; j++) p2 += chars[rnd(chars.length)];
  app.innerHTML =
    '<div class="card anim-in">' +
      '<div class="dip">' +
        '<div class="ttl">Acreditativo de acceso a la red</div>' +
        '<div class="mut small">' + esc(CFG.finca) + ' · ' + esc(CFG.red) + '</div>' +
        '<div class="who">' + esc(G.nombre) + '</div>' +
        '<p class="mut small">Ha superado las ' + TOTAL_FASES + ' fases del portal de invitados con <b>' + G.done + '/16 sellos</b> ' + (G.done < 16 ? "(alguno de lástima, pero sellos)" : "") + ' y queda autorizado a:</p>' +
        '<p style="margin:6px 0"><b>Contraseña de la red:</b><br><span class="pwd">' + p1 + '-' + p2 + '</span></p>' +
        '<div class="sello" id="selloDip">🎉</div>' +
        '<p class="mut small">(La contraseña está tachada a propósito. Es una metáfora.)</p>' +
      '</div>' +
      '<button class="btn pri" id="desc" type="button">📶 DESCARGAR CONTRASEÑA</button>' +
      '<button class="btn ghost" id="repetir" type="button">Pasarle la broma a otro amigo</button>' +
    '</div>';
  $("desc").onclick = function(){ go("final"); };
  $("repetir").onclick = function(){ resetJuego(); };

  // easter egg: mantener pulsado el sello
  var sello = $("selloDip"), tLP = null;
  function secreto(){
    sello.textContent = "🍺🎂🥳🎵🍕🎁";
    toast("Felicidades a los cumpleañeros de parte del wifi invisible.", 5000);
  }
  sello.addEventListener("pointerdown", function(){
    tLP = setTimeout(secreto, 900);
  });
  sello.addEventListener("pointerup", function(){ clearTimeout(tLP); });
  sello.addEventListener("pointerleave", function(){ clearTimeout(tLP); });
};

/* ================= FINAL: rickroll ================= */
screens.final = function(){
  setProg("Completado");
  app.innerHTML =
    '<div class="card" style="text-align:center">' +
      '<div class="spin" style="margin:18px auto"></div>' +
      '<p class="mut" id="fmsg">Conectando a ' + esc(CFG.red) + '…</p>' +
    '</div>';
  var n = 0;
  var pasos = ["Negociando IP…","Buscando repetidor…","Cambiando la contraseña por otra…","Desactivando el cortafuegos…"];
  var iv = setInterval(function(){
    n++;
    if (n < pasos.length && $("fmsg")) $("fmsg").textContent = pasos[n];
  }, 420);
  setTimeout(function(){
    clearInterval(iv);
    var ov = document.createElement("div");
    ov.className = "overlay anim-in";
    ov.innerHTML =
      '<div class="big">NO HAY WIFI.<br>SOLO BARRA LIBRE.</div>' +
      '<p class="mut">' + esc(CFG.cumpleaneros) + ' os agradecen la visita.<br>Feliz cumpleaños. 🎉</p>' +
      '<div class="ytbox" id="yt" role="button" tabindex="0" aria-label="Ver el vídeo">' +
        '<img src="https://i.ytimg.com/vi/' + YT_ID + '/hqdefault.jpg" alt="Vídeo sorpresa" loading="lazy">' +
        '<div class="ytplay"><div class="tri"></div><span>Lo que Luis y Jaime hicieron el finde pasado</span></div>' +
      '</div>' +
      '<p class="mut small" style="margin-top:14px">Ningún router ha sido dañado en esta broma.</p>' +
      '<button class="btn ghost" id="ovreset" type="button" style="margin-top:10px;max-width:220px">Empezar de cero</button>';
    document.body.appendChild(ov);
    function bindReset(){
      var b = $("ovreset");
      if (b) b.onclick = function(){ ov.remove(); resetJuego(); };
    }
    function abrir(){
      ov.innerHTML =
        '<div class="big" style="font-size:clamp(20px,6vw,28px)">NO HAY WIFI. SOLO BARRA LIBRE.</div>' +
        '<iframe src="https://www.youtube-nocookie.com/embed/' + YT_ID + '?autoplay=1&rel=0" ' +
        'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen ' +
        'style="width:min(94vw,520px);aspect-ratio:16/9;border:0;border-radius:14px;margin-top:10px"></iframe>' +
        '<button class="btn ghost" id="ovreset" type="button" style="margin-top:12px;max-width:220px">Empezar de cero</button>';
      bindReset();
    }
    var yt = $("yt");
    yt.onclick = abrir;
    yt.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); abrir(); } });
    bindReset();
  }, 2100);
};

/* ================= arranque ================= */
function resetJuego(){
  G = nuevoEstado();
  refrescaNotas();
  go("cebo");
}

function render(screen){
  try { screens[screen](); }
  catch(err){
    app.innerHTML = '<div class="card"><h1>Ups</h1><p class="mut">Algo se ha roto en la verificación. Vuelve a empezar.</p><button class="btn pri" id="upsReset" type="button">Empezar de cero</button></div>';
    console.error(err);
    var b = $("upsReset");
    if (b) b.onclick = resetJuego;
  }
}

document.getElementById("reset").onclick = function(){ resetJuego(); };
refrescaNotas();
go("cebo");

})();
</script>
